<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matematika teszt</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">

<h1>Matematika dolgozat</h1>

<p>
Add meg a dolgozat kódját:
</p>


<input 
id="testCode"
placeholder="Pl. EGYENLET9">


<br><br>


<button onclick="startTest()">
Teszt indítása
</button>


<p id="error"></p>


</div>


<script src="tests.js"></script>

<script>


function startTest(){


let code =
document.getElementById("testCode").value;


if(tests[code]){


localStorage.setItem(
"currentTest",
code
);


window.location.href="test.html";


}

else{


document.getElementById("error").innerHTML =
"Hibás dolgozatkód!";


}


}



</script>


</body>

</html>
